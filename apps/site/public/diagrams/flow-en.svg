<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 232" role="img">
  <title>Your app calls Unicep, which tries Provider 1, then Provider 2 and so on, each with its own circuit breaker, and always returns the same Address object.</title>
  <defs>
    <style>
      text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .box { fill: #000; stroke: #333; stroke-width: 1; }
      .main { fill: #000; stroke: #fafafa; stroke-width: 1.5; }
      .pill { fill: none; stroke: #333; stroke-width: 1; }
      .line { stroke: #fafafa; stroke-width: 1.5; fill: none; }
      .dash { stroke: #a1a1a1; stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
      .label { fill: #fafafa; font-size: 16px; font-weight: 500; }
      .strong { font-weight: 700; }
      .small { fill: #a1a1a1; font-size: 12.5px; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fafafa"/></marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1a1"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="771" height="231" rx="12" fill="#0a0a0a" stroke="#1f1f1f"/>
  <g transform="translate(16 16)">
  <rect x="8" y="76" width="104" height="56" rx="10" class="box"/>
  <text x="60" y="108" class="label" text-anchor="middle">Your app</text>
  <line x1="112" y1="104" x2="146" y2="104" class="line" marker-end="url(#m)"/>
  <rect x="148" y="76" width="104" height="56" rx="10" class="main"/>
  <text x="200" y="108" class="label strong" text-anchor="middle">Unicep</text>
  <line x1="252" y1="104" x2="290" y2="104" class="line" marker-end="url(#m)"/>
  <rect x="292" y="76" width="104" height="56" rx="10" class="box"/>
  <text x="344" y="108" class="label" text-anchor="middle">Provider 1</text>
  <rect x="294" y="142" width="100" height="20" rx="10" class="pill"/>
  <text x="344" y="156" class="small" text-anchor="middle">circuit breaker</text>
  <line x1="396" y1="104" x2="456" y2="104" class="dash" marker-end="url(#m-muted)"/>
  <text x="427" y="94" class="small" text-anchor="middle">failed</text>
  <rect x="460" y="76" width="104" height="56" rx="10" class="box"/>
  <text x="512" y="108" class="label" text-anchor="middle">Provider 2</text>
  <rect x="462" y="142" width="100" height="20" rx="10" class="pill"/>
  <text x="512" y="156" class="small" text-anchor="middle">circuit breaker</text>
  <line x1="564" y1="104" x2="624" y2="104" class="dash" marker-end="url(#m-muted)"/>
  <text x="595" y="94" class="small" text-anchor="middle">failed</text>
  <rect x="628" y="76" width="104" height="56" rx="10" class="box"/>
  <text x="680" y="108" class="label" text-anchor="middle">Provider N</text>
  <rect x="630" y="142" width="100" height="20" rx="10" class="pill"/>
  <text x="680" y="156" class="small" text-anchor="middle">circuit breaker</text>
  <path d="M 512 166 V 192 H 60 V 134" class="dash" marker-end="url(#m-muted)"/>
  <text x="286" y="184" class="small" text-anchor="middle">always the same Address object</text>
  </g>
</svg>
