name: Deploy site

# Builds and tests the site (apps/site: docs and status page) and then asks Render to deploy this commit.
# Requires the RENDER_DEPLOY_HOOK_URL secret (Render service > Settings > Deploy Hook) and the
# service must have auto-deploy turned off (render.yaml already does this).
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/core/**
      - render.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@unicep/site..." build
      - run: pnpm --filter "@unicep/site" typecheck
      - run: pnpm --filter "@unicep/site" test

  deploy:
    name: Deploy to Render
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          # Deploy exactly this commit (the hook URL already has a ?key= query string).
          curl --fail --silent --show-error --max-time 30 -X POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo "Deploy triggered for ${GITHUB_SHA}."
