name: Feature request
description: Suggest an idea or a new CEP provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new provider, include the API docs URL and rate limits.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
