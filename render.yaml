# Render Blueprint for the site, i.e. docs and status page (apps/site).
# Render deploys it through its GitHub integration: on each push to the linked branch it waits
# for the repository's CI checks (`checksPass`) and only rebuilds when the files below change.
services:
  - type: web
    name: unicep-site
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/site/**
        - packages/core/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@unicep/site..." build
    startCommand: node apps/site/dist/server/entry.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
