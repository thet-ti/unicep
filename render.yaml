# Render Blueprint for the status page (apps/status).
# Deploys are triggered by the "Deploy status page" GitHub workflow through a deploy hook, so
# Render's own auto-deploy is turned off.
services:
  - type: web
    name: unicep-status
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@unicep/status..." build
    startCommand: node apps/status/dist/server/entry.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
